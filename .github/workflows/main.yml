name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

  # Advisories appear without anything changing here.
  schedule:
    - cron: "47 5 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - "3.3.4"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Run the default task
        run: bundle exec rake

  # The one check branch protection requires, so the matrix can change.
  ci:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
